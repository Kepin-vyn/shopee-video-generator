services:
  db:
    ports:
      - "5432:5432"   # expose for local DB clients

  redis:
    ports:
      - "6379:6379"   # expose for redis-cli

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - ./backend/app:/app/app          # live reload source
      - ./storage:/app/storage
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/shopee_video_db
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: dev-secret-key-not-for-production
      STORAGE_DIR: /app/storage
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    volumes:
      - ./backend/app:/app/backend/app   # live reload
      - ./worker:/app/worker
      - ./storage:/app/storage
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/shopee_video_db
      REDIS_URL: redis://redis:6379/0
      STORAGE_DIR: /app/storage
      CELERY_CONCURRENCY: 1

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    command: npm run dev

# ─── Development override comments ────────────────────────────────────────────
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#
# Changes vs production:
#   - No Nginx (direct port exposure)
#   - Backend & worker run with --reload / hot-reload
#   - Source code mounted as volumes for live editing
#   - Frontend runs `next dev` (hot reload)
